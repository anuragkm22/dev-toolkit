<!--
  Google Analytics 4 (GA4).

  This is a REFERENCE COPY, not something the build includes automatically
  — the same snippet is pasted into every page's <head> individually,
  since the trust pages and homepage are plain static HTML with no build
  step of their own. Keep this file in sync if you change the snippet, so
  there's one place to see what's supposed to be on every page.

  BEFORE DEPLOYING: replace G-XXXXXXXXXX below (in every page — see the
  list in BUILD_SUMMARY.md) with your real GA4 Measurement ID from
  https://analytics.google.com (Admin > Data Streams > your stream).
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() {
    dataLayer.push(arguments);
  }
  gtag("js", new Date());
  gtag("config", "G-XXXXXXXXXX");
</script>
